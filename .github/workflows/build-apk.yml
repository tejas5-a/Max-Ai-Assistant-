name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi
          
          # Detect active Java major version
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VERSION_OUTPUT"
          
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -E 's/.*version "([^"]+)".*/\1/' | sed -E 's/^1\.//' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect active Java major version." >&2
            exit 1
          fi
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Detected: $JAVA_MAJOR" >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK file '$EXPECTED_APK' is missing." >&2
            echo "Searching only inside app/build/outputs/apk:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" >&2
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file '$EXPECTED_APK' is empty (0 bytes)." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: '$EXPECTED_APK' does not have .apk extension." >&2; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

          echo "APK successfully verified at: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$ASSET_DIR"
          
          REPO_RAW="${{ github.repository }}"
          REPO_SHORT=$(echo "$REPO_RAW" | awk -F'/' '{print $2}')
          REPO_CLEAN=$(echo "$REPO_SHORT" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          
          RELEASE_FILENAME="${REPO_CLEAN}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${RELEASE_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset was not copied properly to $ASSET_PATH" >&2
            exit 1
          fi
          
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset '$ASSET_PATH' does not exist or is empty." >&2
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset is not an .apk file: $ASSET_PATH" >&2; exit 1 ;;
          esac
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat << 'EOF'
          ### Debug APK Build
          
          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Intended Use**: This APK is intended for testing and development.
          - **Note**: This is not a Play Store production release. It is signed only with a temporary debug keystore.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            
            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published to GitHub Releases:"
              echo "- **Release Page**: [Download $ASSET_NAME]($RELEASE_URL)"
              echo "- **Direct Download**: Download \`$ASSET_NAME\` directly from the **Assets** section of the release page on your Android phone."
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Actions Artifact**: The standard Actions artifact \`app-debug-apk\` is also preserved and available as a backup under this workflow run's Artifacts section."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The debug APK build and GitHub Actions artifact upload succeeded."
            echo "The standard Actions artifact 'app-debug-apk' remains available for download."
            
            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Warning)"
              echo ""
              echo "The debug APK was successfully built and uploaded as a GitHub Actions artifact."
              echo "However, GitHub Release publishing could not be completed."
              echo ""
              echo "- **Actions Artifact**: \`app-debug-apk\` is available for download in the Artifacts section of this workflow run."
              echo "- **Backup Note**: You can download the APK zip artifact directly from this run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
